minimum_pre_commit_version: "3.6.0"
default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg
default_language_version:
  python: "3.14"
exclude: '^(\.venv|dist|build|\.pytest_cache|\.ruff_cache|\.mypy_cache|site)/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-docstring-first
      - id: debug-statements
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-format
        name: Ruff format
      - id: ruff-check
        name: Ruff lint
        args: [--fix]

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        name: remove unused imports/variables
        args: [--in-place, --remove-all-unused-imports, --remove-unused-variables]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: security check Python
        args: [-c, pyproject.toml, -r, src]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/djlint/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-reformat-django
        name: format Django templates
        files: \.html$
      - id: djlint-django
        name: lint Django templates
        files: \.html$
        args: [--ignore, H021,H023]

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        name: format Markdown
        types: [markdown]
        additional_dependencies:
          - mdformat-gfm
          - mdformat-mkdocs

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.12.2
    hooks:
      - id: markdown-link-check
        name: check documentation links
        args: [--quiet]
        stages: [pre-push, manual]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        name: check for common misspellings
        files: '\.(py|md|ya?ml|toml)$'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: check shell scripts
        args: [--severity=warning]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.4.1
    hooks:
      - id: commitizen
        name: validate commit message format
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: pytest
        name: run tests
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: pytest-coverage
        name: check test coverage
        entry: bash -c 'uv run pytest --cov --cov-report=term-missing --cov-fail-under=80'
        language: system
        pass_filenames: false
        stages: [pre-push, manual]

      - id: mypy
        name: type check Python
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
