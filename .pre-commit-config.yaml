minimum_pre_commit_version: "3.6.0"
default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg
default_language_version:
  python: "3.14"
exclude: '^(\.venv|dist|build|\.pytest_cache|\.ruff_cache|\.mypy_cache|site)/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-docstring-first
      - id: debug-statements
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-format
        name: Ruff format
      - id: ruff-check
        name: Ruff lint
        args: [--fix]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: security check Python
        args: [-c, pyproject.toml, -r, src]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/djlint/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-reformat-django
        name: format Django templates
        files: \.html$
        # Package templates and golden files are the markup contract; never reflow them.
        exclude: ^(src/daisy_forms/templates|tests/golden|tests/templates)/
      - id: djlint-django
        name: lint Django templates
        files: \.html$
        exclude: ^tests/golden/
        args: [--ignore, "H021,H023,H030,H031"]

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        name: format Markdown
        types: [markdown]
        files: ^docs/
        args: [--number]
        # Same plugins as `just doc-format`. Avoid mdformat-web and mdformat-ruff,
        # which rewrite the HTML and Python examples. Runs on demand only.
        stages: [manual]
        additional_dependencies:
          - mdformat-footnote==0.1.3
          - mdformat-front-matters==2.0.0
          - mdformat-gfm==1.0.0
          - mdformat-mkdocs==5.3.0

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.12.2
    hooks:
      - id: markdown-link-check
        name: check documentation links
        # Rate-limited (429) responses count as alive; see .markdown-link-check.json.
        args: [--quiet, --config, .markdown-link-check.json]
        stages: [pre-push, manual]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        name: check for common misspellings
        files: '\.(py|md|ya?ml|toml)$'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: check shell scripts
        args: [--severity=warning]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.4.1
    hooks:
      - id: commitizen
        name: validate commit message format
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: pytest
        name: run tests
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: pytest-coverage
        name: check test coverage
        entry: uv run pytest --cov
        language: system
        pass_filenames: false
        stages: [pre-push, manual]

      - id: mypy
        name: type check Python
        entry: uv run mypy --strict src/daisy_forms tests
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
