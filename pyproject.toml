[project]
name = "django-daisy-forms"
version = "0.1.0"
description = "daisyUI 5 forms for Django, rendered through Django's own form renderer"
readme = "README.md"
authors = [{ name = "Diego Gamboa", email = "difegam3@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
keywords = ["daisyui", "django", "forms", "tailwind"]
dependencies = ["Django>=5.2,<6.2"]

[project.urls]
Changelog = "https://github.com/difegam/django-daisy-forms/blob/main/CHANGELOG.md"
Documentation = "https://difegam.github.io/django-daisy-forms/"
Issues = "https://github.com/difegam/django-daisy-forms/issues"
Source = "https://github.com/difegam/django-daisy-forms"

[dependency-groups]
test = ["pytest>=8.4", "pytest-cov>=7.0", "pytest-django>=4.11"]
lint = ["prek>=0.4", "ruff>=0.14"]
type = [
    "django-stubs-ext>=5.2",
    "django-stubs[compatible-mypy]>=5.2",
    "mypy>=1.18",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "type" },
]
docs = ["zensical>=0.0.69"]
browser = ["playwright==1.63.0"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-m 'not browser'"
markers = [
    "browser: optional local browser checks requiring Playwright and Chromium",
]

[tool.coverage.run]
branch = true
source = ["daisy_forms"]

[tool.coverage.report]
fail_under = 94
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["ANN", "B", "DJ", "E", "F", "I", "RUF", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
files = ["src/daisy_forms", "tests"]
exclude = ["^build/", "^dist/", ".*/migrations/.*"]

[[tool.mypy.overrides]]
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "daisy_forms"
