{% if field.help_text %}<p class="label"{% if field.auto_id %} id="{{ field.auto_id }}_helptext"{% endif %}>{{ field.help_text }}</p>{% endif %}
{% if field.errors %}<ul class="text-error text-sm"{% if field.auto_id %} id="{{ field.auto_id }}_error"{% endif %}>{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
