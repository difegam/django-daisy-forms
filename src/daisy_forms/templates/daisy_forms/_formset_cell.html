{% if field.use_fieldset %}<div role="group" aria-labelledby="{{ label_id }}"{% if field.aria_describedby %} aria-describedby="{{ field.aria_describedby }}"{% endif %}>{{ widget }}</div>{% else %}{{ widget }}{% endif %}{% if field.help_text %}<span class="sr-only"{% if field.auto_id %} id="{{ field.auto_id }}_helptext"{% endif %}>{{ field.help_text }}</span>{% endif %}{% if field.errors %}<ul class="text-error text-sm"{% if field.auto_id %} id="{{ field.auto_id }}_error"{% endif %}>{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
