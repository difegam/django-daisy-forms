<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>django-daisy-forms formset preview</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{% url 'form_preview_css' %}">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; }
    main { margin: 0 auto; max-width: 60rem; display: flex; flex-direction: column; gap: 2rem; }
  </style>
  {% if not nojs %}<script src="{% url 'formset_preview_js' %}" defer></script>{% endif %}
</head>
<body>
  <main>
    <h1 class="text-2xl font-semibold">Formset preview</h1>
    <form method="post" action="{% url 'formset_preview' %}{% if nojs %}?nojs=1{% endif %}" class="flex flex-col gap-8">
      {% csrf_token %}
      <section id="saved"><h2 class="text-lg font-semibold">Saved items (table)</h2>{% include "daisy_forms/formset_table.html" with formset=saved %}</section>
      <section id="lines"><h2 class="text-lg font-semibold">Lines (cards, 1–3)</h2>{% include "daisy_forms/formset_dynamic.html" with formset=lines %}</section>
      <button class="btn btn-primary" type="submit">Submit</button>
    </form>
    <template id="swap-source">{% include "daisy_forms/formset_dynamic.html" with formset=fragment %}</template>
    <section id="swap-target"></section>
  </main>
</body>
</html>
