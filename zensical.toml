[project]
site_name = "Django Daisy Forms"
site_description = "daisyUI 5 forms for Django, rendered through Django's own form renderer"
site_url = "https://difegam.github.io/django-daisy-forms/"
repo_name = "difegam/django-daisy-forms"
repo_url = "https://github.com/difegam/django-daisy-forms"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
dev_addr = "localhost:8000"

nav = [
    { Home = "index.md" },
    { "Getting Started" = [
        { Overview = "getting-started/index.md" },
        { "Why Django Daisy Forms" = "getting-started/why.md" },
    ] },
    { Guide = [
        { Overview = "guide/index.md" },
        { "Rendering Forms" = "guide/rendering.md" },
        { "Validation & Errors" = "guide/validation.md" },
        { "Per-Field Control" = "guide/per-field-control.md" },
        { "Layouts & Addons" = "guide/layouts-addons.md" },
        { "Tailwind CSS Integration" = "guide/tailwind-css.md" },
        { "Themes" = "guide/themes.md" },
        { "Troubleshooting" = "guide/troubleshooting.md" },
    ] },
    { Reference = [
        { Overview = "reference/index.md" },
        { "Widgets" = "reference/widgets.md" },
        { "Template Tags" = "reference/template-tags.md" },
        { "Templates" = "reference/templates.md" },
        { "Management Commands" = "reference/management-commands.md" },
        { "System Checks" = "reference/system-checks.md" },
    ] },
    { Recipes = [
        { Overview = "recipes/index.md" },
        { "HTMX Form Validation" = "recipes/htmx-form-validation.md" },
    ] },
    { Development = [
        { Overview = "development/index.md" },
        { Contributing = "development/contributing.md" },
    ] },
    { Changelog = "changelog.md" },
]

[project.theme]
variant = "modern"
logo = "assets/logo.svg"
favicon = "assets/favicon.ico"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.tabs.link",
    "navigation.expand",
    "navigation.indexes",
    "navigation.instant",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "search.highlight",
    "search.suggest",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"
previous = "lucide/chevron-left"
next = "lucide/chevron-right"
top = "lucide/arrow-up"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.markdown_extensions]
admonition = {}
abbr = {}
attr_list = {}
footnotes = {}
md_in_html = {}
tables = {}

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
